name: Build PhoniLock
on:
  push:
    branches: [main]
    paths:
      - 'tweaks/PhoniLock/**'
      - 'scripts/prepare-theos.sh'
      - 'scripts/check_phonilock.py'
      - '.github/workflows/phonilock.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    env:
      THEOS: ${{ github.workspace }}/.build-tools/theos
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rsync libtinfo6 libxml2-utils
      - uses: actions/cache@v4
        with:
          path: .build-tools
          key: phonilock-theos-${{ runner.os }}-${{ hashFiles('scripts/prepare-theos.sh') }}
      - name: Prepare pinned Theos and SDK
        run: bash scripts/prepare-theos.sh
      - name: Compile arm64 tweak and preferences
        run: make -C tweaks/PhoniLock package FINALPACKAGE=1
      - name: Check installable package
        run: python scripts/check_phonilock.py tweaks/PhoniLock/packages/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: PhoniLock-ios12-beta
          path: tweaks/PhoniLock/packages/*.deb
          if-no-files-found: error
