<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07110e">
  <meta name="description" content="My tweaks and other stuff for iOS 12.5.8. Add the repo in Sileo to install them.">
  <title>Phoni’s repo</title>
  <link rel="icon" href="CydiaIcon.png?v=2" type="image/png">
  <link rel="apple-touch-icon" href="CydiaIcon.png?v=2">
  <link rel="stylesheet" href="style.css?v=2">
  <script src="app.js?v=2" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="ambient" aria-hidden="true"></div>
  <header class="nav-wrap">
    <nav aria-label="Main navigation">
      <a class="brand" href="./"><img src="CydiaIcon.png?v=2" width="26" height="26" alt=""><span>phoni<span class="brand-light"> / repo</span></span></a>
      <div class="nav-links"><a href="#packages">Packages</a><a href="#source">Add source</a></div>
      <a class="source-link" href="https://github.com/realphoni/phoni-repo">GitHub <span aria-hidden="true">↗</span></a>
    </nav>
  </header>
  <main id="main">
    <section class="hero wrap" id="source">
      <div class="hero-copy">
        <p class="hello">hey, i’m phoni.</p>
        <h1>my sileo repo <span>:)</span></h1>
        <p class="intro">My tweaks and other stuff for iOS 12.5.8.<br>Add the repo in Sileo to install them.</p>
        <div class="actions"><a class="button primary" href="sileo://source/https://realphoni.github.io/phoni-repo/">Add to Sileo <span aria-hidden="true">＋</span></a><a class="button secondary" href="#packages">Browse tweaks <span aria-hidden="true">↗</span></a></div>
        <div class="repo-address"><code id="repo-url">https://realphoni.github.io/phoni-repo/</code><button id="copy-source" aria-label="Copy repository URL" title="Copy repository URL"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg></button></div>
      </div>
    </section>
    <section class="wrap packages-section" id="packages">
      <div class="section-heading"><div><h2>My tweaks</h2></div><span id="package-count" class="count">Loading packages…</span></div>
      <div class="package-toolbar"><label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg><input type="search" id="package-search" placeholder="Find a package…" aria-label="Search packages"></label><div class="filters" aria-label="Package filters"><button data-filter="all" class="selected" aria-pressed="true">All packages</button><button data-filter="Tweaks" aria-pressed="false">Tweaks</button><button data-filter="Themes" aria-pressed="false">Themes</button><button data-filter="Utilities" aria-pressed="false">Utilities</button></div></div>
      <div id="package-list" class="package-grid" aria-live="polite"><div class="empty-state"><span class="empty-symbol">＋</span><h3>Loading tweaks…</h3></div></div>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p class="wrap">JavaScript is needed for the website package list. The Sileo source works independently. <a href="https://github.com/realphoni/phoni-repo/tree/main/debs">Browse package files on GitHub</a>.</p></noscript>
</body>
</html>
